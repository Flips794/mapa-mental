<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Mental</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 16L6 8M16 16L26 9M16 16L25 25' stroke='%2394a3b8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%236366f1'/%3E%3Ccircle cx='6' cy='8' r='3.5' fill='%23ec4899'/%3E%3Ccircle cx='26' cy='9' r='3.5' fill='%2322c55e'/%3E%3Ccircle cx='25' cy='25' r='3.5' fill='%23f97316'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1e293b; --muted:#64748b; --line:#e5e7eb;
    --ring:#3b82f6; --dot:#d6dae0; --hover:#f1f3f5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;font-size:14px;
  }
  button{font-family:inherit}
  .hidden{display:none!important}

  /* ---------- Barra superior ---------- */
  header{
    height:46px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 10px;
    background:var(--panel);border-bottom:1px solid var(--line);z-index:20;
  }
  .logo{font-weight:650;font-size:14px;display:flex;align-items:center;gap:8px;padding:0 8px 0 2px;white-space:nowrap}
  .logo .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#ec4899)}
  .ib{
    height:30px;min-width:30px;padding:0 9px;border:0;background:transparent;border-radius:7px;color:var(--ink);
    font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  }
  .ib:hover{background:var(--hover)}
  .ib:disabled{opacity:.3;cursor:default;background:transparent}
  .ib.on{background:#eef2ff;color:#4338ca}
  .ib svg{width:16px;height:16px;flex:0 0 auto}
  .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .spacer{flex:1}
  .search{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:var(--hover);margin-left:6px}
  .search svg{width:14px;height:14px;color:var(--muted)}
  .search input{border:0;outline:0;background:transparent;font-size:13px;width:170px;color:var(--ink)}
  .search .cnt{font-size:11px;color:var(--muted);white-space:nowrap}
  .status{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap;min-width:88px;text-align:right}

  /* ---------- Área do mapa ---------- */
  main{flex:1;display:flex;min-height:0}
  #canvas{
    position:relative;flex:1;overflow:hidden;background-color:var(--bg);
    background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:20px 20px;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #canvas.panning{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

  /* ---------- Tópicos ---------- */
  .node{
    position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;width:max-content;max-width:280px;
    font-size:13.5px;line-height:1.4;color:var(--ink);word-break:break-word;--c:#64748b;cursor:default;
  }
  .node .content{outline:0;min-width:16px;flex:1 1 auto}
  .node .content p,.node .content div{margin:0}
  .node .content ul,.node .content ol{margin:2px 0;padding-left:18px}
  .node .content a{color:#2563eb}
  .node .content b,.node .content strong{font-weight:700}
  .node.empty .content::before{content:"Sem título";color:#a0aab8;font-weight:400}
  .node.empty.editing .content::before{content:"Digite…"}

  .node.lv0{
    background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:9px 16px;
    font-size:16px;font-weight:600;max-width:300px;box-shadow:0 2px 8px rgba(15,23,42,.08);
  }
  .node.lv0 .content b,.node.lv0 .content strong{font-weight:800}
  .node.lv1{
    background:#fff;border:2px solid var(--c);border-radius:8px;padding:5px 11px;font-weight:500;
    box-shadow:0 1px 2px rgba(15,23,42,.05);
  }
  .node.lvn{padding:2px 4px 3px;border-bottom:2px solid var(--c)}
  .node.lvn:hover{background:rgba(15,23,42,.035)}
  .node.lv1:hover,.node.lv0:hover{box-shadow:0 3px 10px rgba(15,23,42,.12)}
  .node.sel{outline:2px solid var(--ring);outline-offset:3px}
  .node.lvn.sel{outline-offset:1px;border-radius:3px 3px 0 0}
  .node.editing{outline:2px solid var(--ring);outline-offset:3px;cursor:text}
  .node.editing .content{user-select:text;-webkit-user-select:text;cursor:text}
  .node.match{background:#fef3c7}
  .node.fresh{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

  /* área invisível para o mouse alcançar os botões laterais */
  .node.dirR::after,.node.lv0::before{content:"";position:absolute;top:-6px;bottom:-6px;width:52px}
  .node.dirR::after{left:100%}
  .node.dirL::after{content:"";position:absolute;top:-6px;bottom:-6px;width:52px;right:100%}
  .node.lv0::before{right:100%}
  .node.lv0::after{content:"";position:absolute;top:-6px;bottom:-6px;width:52px;left:100%}
  .node.lvn::after{top:-4px;bottom:-14px}

  .badges{display:inline-flex;gap:3px;flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:400}
  .bd{display:inline-flex;align-items:center;gap:2px;background:rgba(100,116,139,.1);border-radius:5px;padding:0 4px;line-height:17px}

  /* botões laterais (+ e recolher) */
  .h{
    position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:9px;border:1.5px solid var(--c);
    background:#fff;color:var(--c);font-size:13px;font-weight:700;line-height:1;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .1s,transform .1s;z-index:2;
  }
  .node.lvn .h{top:100%}
  .node.lv0 .h{border-color:var(--ink);color:var(--ink)}
  .node:hover .h,.node.sel .h,.h.count{opacity:1;pointer-events:auto}
  .h:hover{transform:scale(1.15)}
  .h.count{width:auto;min-width:18px;padding:0 5px;font-size:10px;background:var(--c);color:#fff}
  .node.editing .h{opacity:0;pointer-events:none}

  /* arrastar e soltar */
  .node.drag-src{opacity:.25}
  .node.drop-child{outline:2px dashed var(--ring);outline-offset:4px}
  .ghost{pointer-events:none;opacity:.92;box-shadow:0 10px 28px rgba(15,23,42,.22)!important;z-index:50;background:#fff}
  .drop-line{position:absolute;height:3px;margin-top:-1.5px;background:var(--ring);border-radius:2px;pointer-events:none;z-index:49}

  /* zoom */
  .zoombar{
    position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:1px;background:#fff;
    border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(15,23,42,.08);z-index:5;
  }
  .zoombar .pct{font-size:12px;min-width:46px;text-align:center;color:var(--muted);cursor:pointer;border-radius:6px;padding:6px 0}
  .zoombar .pct:hover{background:var(--hover)}
  .keys-pop{
    position:absolute;left:12px;bottom:58px;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 28px rgba(15,23,42,.14);padding:12px 14px;z-index:6;width:290px
  }

  /* lista de atalhos */
  .keys{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
  kbd{
    font-family:inherit;font-size:11px;background:#f8fafc;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;color:var(--ink);white-space:nowrap
  }

  /* ---------- Painel lateral ---------- */
  #panel{
    flex:0 0 330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0
  }
  .p-empty{padding:28px 20px;color:var(--muted);font-size:13px;line-height:1.6}
  .p-empty h3{margin:0 0 6px;color:var(--ink);font-size:14px}
  .p-empty p{margin:0 0 18px}
  .p-body{flex:1;overflow:auto;padding:12px 16px 22px;display:flex;flex-direction:column;gap:14px}
  .p-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .p-kind{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
  .p-kind .chip{width:10px;height:10px;border-radius:3px;background:var(--c,#64748b)}
  .p-actions{display:flex;gap:1px}
  .p-actions .ib{height:28px;min-width:28px;padding:0 6px;font-size:12px;color:var(--muted)}
  .p-actions .ib:hover{color:var(--ink)}
  .p-actions .ib.danger:hover{color:#dc2626;background:#fef2f2}

  .fmtbar{
    position:sticky;top:-12px;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:1px;padding:4px;
    border:1px solid var(--line);border-radius:9px;background:#fafbfc
  }
  .fmtbar button{
    width:30px;height:28px;border:0;background:transparent;border-radius:6px;cursor:pointer;color:var(--ink);
    font-size:14px;display:flex;align-items:center;justify-content:center;padding:0
  }
  .fmtbar button svg{width:16px;height:16px}
  .fmtbar button:hover{background:#eceef1}
  .fmtbar button.on{background:#e0e7ff;color:#4338ca}
  .fmtbar .fsep{width:1px;height:18px;background:var(--line);margin:0 3px}

  .p-sec h4{
    margin:0 0 6px;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;justify-content:space-between;gap:8px
  }
  .p-sec h4 .sub{text-transform:none;letter-spacing:0;font-weight:400}
  .rte{
    position:relative;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:84px;max-height:320px;
    overflow:auto;outline:0;font-size:14px;line-height:1.5;cursor:text;word-break:break-word;transition:border-color .1s,box-shadow .1s
  }
  .rte.note{min-height:70px;font-size:13px}
  .rte:focus{border-color:var(--ring);box-shadow:0 0 0 3px rgba(59,130,246,.13)}
  .rte.is-empty::before{content:attr(data-ph);position:absolute;left:12px;top:9px;color:#a0aab8;pointer-events:none}
  .rte p,.rte div{margin:0}
  .rte ul,.rte ol{margin:3px 0;padding-left:22px}
  .rte a{color:#2563eb}

  .swatches{display:flex;flex-wrap:wrap;gap:5px}
  .swatch{width:21px;height:21px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
  .swatch.on{box-shadow:0 0 0 2px var(--ink)}
  .swatch:hover{transform:scale(1.1)}

  .att-btns{display:flex;gap:2px}
  .att-btns .ib{height:24px;font-size:11px;padding:0 7px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
  .att-list{display:flex;flex-direction:column;gap:6px}
  .att{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px}
  .att img{width:34px;height:34px;object-fit:cover;border-radius:5px;cursor:zoom-in}
  .att .ic{width:34px;height:34px;border-radius:5px;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:16px}
  .att .meta{flex:1;min-width:0}
  .att .nm{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att .sz{font-size:11px;color:var(--muted)}
  .att .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;padding:3px 5px;border-radius:5px}
  .att .x:hover{color:var(--ink);background:var(--hover)}
  .att .x.del:hover{color:#dc2626}
  .hint{font-size:12px;color:var(--muted)}
  details.more summary{font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  details.more .keys{margin-top:10px}

  /* ---------- Lightbox / Toast ---------- */
  #lightbox{position:fixed;inset:0;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out}
  #lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
    padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  #toast.show{opacity:1}

  @media(max-width:760px){
    #panel{position:fixed;left:0;right:0;bottom:0;height:48vh;border-left:0;border-top:1px solid var(--line);z-index:30;box-shadow:0 -8px 24px rgba(0,0,0,.1)}
    .search input{width:80px}
    .hide-sm{display:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>Mapa Mental</div>
  <label class="search" title="Buscar (Ctrl+F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" placeholder="Buscar…" autocomplete="off">
    <span class="cnt" id="searchCnt"></span>
  </label>
  <div class="spacer"></div>
  <button class="ib" id="undoBtn" title="Desfazer (Ctrl+Z)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
  </button>
  <button class="ib" id="redoBtn" title="Refazer (Ctrl+Shift+Z)" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>
  </button>
  <span class="sep"></span>
  <button class="ib" id="importBtn" title="Importar backup .json">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>
    <span class="hide-sm">Importar</span>
  </button>
  <button class="ib" id="exportBtn" title="Exportar backup .json">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>
    <span class="hide-sm">Exportar</span>
  </button>
  <span class="sep"></span>
  <button class="ib on" id="panelBtn" title="Mostrar / esconder painel de edição">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
  </button>
  <div class="status hide-sm" id="status">—</div>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
</header>

<main>
  <div id="canvas">
    <div id="world"><svg id="links"></svg></div>

    <div class="zoombar">
      <button class="ib" id="zoomOut" title="Diminuir zoom (Ctrl −)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <div class="pct" id="zoomPct" title="Voltar para 100%">100%</div>
      <button class="ib" id="zoomIn" title="Aumentar zoom (Ctrl +)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span class="sep"></span>
      <button class="ib" id="fitBtn" title="Ajustar à tela (Ctrl+0)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 011-1h4M15 4h4a1 1 0 011 1v4M20 15v4a1 1 0 01-1 1h-4M9 20H5a1 1 0 01-1-1v-4"/></svg>
      </button>
      <button class="ib" id="keysBtn" title="Atalhos do teclado">?</button>
    </div>
    <div class="keys-pop hidden" id="keysPop"></div>
  </div>

  <aside id="panel">
    <div class="p-empty" id="pEmpty">
      <h3>Nenhum tópico selecionado</h3>
      <p>Clique em um tópico do mapa para editar o texto dele aqui, com negrito, itálico, listas e links.</p>
      <div class="keys" id="keysEmpty"></div>
    </div>

    <div class="p-body hidden" id="pBody">
      <div class="p-head">
        <div class="p-kind"><span class="chip" id="pChip"></span><span id="pKind">Tópico</span></div>
        <div class="p-actions">
          <button class="ib" id="aChild" title="Novo sub-tópico (Tab)">＋ Filho</button>
          <button class="ib" id="aSibling" title="Novo tópico irmão (Enter)">＋ Irmão</button>
          <button class="ib" id="aToggle" title="Recolher / expandir (Espaço)">⊖</button>
          <button class="ib danger" id="aDelete" title="Excluir (Delete)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>
          </button>
        </div>
      </div>

      <div class="fmtbar" id="fmtbar">
        <button data-cmd="bold" title="Negrito (Ctrl+B)"><b>B</b></button>
        <button data-cmd="italic" title="Itálico (Ctrl+I)"><i style="font-family:Georgia,serif">I</i></button>
        <button data-cmd="underline" title="Sublinhado (Ctrl+U)"><u>U</u></button>
        <button data-cmd="strikeThrough" title="Tachado"><s>S</s></button>
        <span class="fsep"></span>
        <button data-cmd="insertUnorderedList" title="Lista com marcadores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>
        </button>
        <button data-cmd="insertOrderedList" title="Lista numerada">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 4.5h1.5V9M3.5 9h3M3.5 14.5c.4-.6 1-1 1.7-1 .8 0 1.4.5 1.4 1.2 0 1.1-3.1 2-3.1 4.3h3.2" stroke-width="1.4"/></svg>
        </button>
        <span class="fsep"></span>
        <button data-cmd="link" title="Inserir link (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
        </button>
        <button data-cmd="removeFormat" title="Limpar formatação">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h12M12 5l-3 14"/><path d="M15 15l5 5M20 15l-5 5"/></svg>
        </button>
      </div>

      <div class="p-sec">
        <h4>Texto do tópico</h4>
        <div class="rte" id="rteText" contenteditable="true" spellcheck="true" data-ph="Escreva o texto do tópico…"></div>
      </div>
      <div class="p-sec">
        <h4>Anotação <span class="sub">fica só aqui no painel</span></h4>
        <div class="rte note" id="rteNote" contenteditable="true" spellcheck="true" data-ph="Detalhes, links, observações…"></div>
      </div>
      <div class="p-sec" id="colorSec">
        <h4>Cor do ramo</h4>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="p-sec">
        <h4>Anexos
          <span class="att-btns">
            <button class="ib" id="addImg">🖼 Imagem</button>
            <button class="ib" id="addDoc">📎 Arquivo</button>
          </span>
        </h4>
        <div class="att-list" id="attList"></div>
        <input type="file" id="imgFile" accept="image/*" multiple class="hidden">
        <input type="file" id="docFile" multiple class="hidden">
      </div>
      <details class="more">
        <summary>Atalhos do teclado</summary>
        <div class="keys" id="keysPanel"></div>
      </details>
    </div>
  </aside>
</main>

<div id="lightbox"><img alt=""></div>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ================= Cores ================= */
const COLORS = {

/* ================= Armazenamento (IndexedDB + fallback) ================= */
const Store = (()=>{
  const DB='mapa_mental_db', ST='kv', K='doc'; let dbP=null;
  function open(){
    if(dbP) return dbP;
    dbP=new Promise((res,rej)=>{
      let r; try{ r=indexedDB.open(DB,1);}catch(e){return rej(e);}
      r.onupgradeneeded=()=>{ try{r.result.createObjectStore(ST);}catch(e){} };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    });
    return dbP;
  }
  async function idbGet(){ const db=await open(); return new Promise((res,rej)=>{ const tx=db.transaction(ST,'readonly'); const q=tx.objectStore(ST).get(K); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
  async function idbSet(v){ const db=await open(); return new Promise((res,rej)=>{ const tx=db.transaction(ST,'readwrite'); tx.objectStore(ST).put(v,K); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
  return {
    async load(){
      try{ const v=await idbGet(); if(v) return v; }catch(e){}
      try{ const s=localStorage.getItem('mapa_mental'); if(s) return JSON.parse(s); }catch(e){}
      return null;
    },
    async save(d){
      try{ await idbSet(d); return true; }catch(e){}
      try{ localStorage.setItem('mapa_mental', JSON.stringify(d)); return true; }catch(e){ return false; }
    }
  };
})();

/* ================= HTML seguro (formatação permitida) ================= */
const ALLOWED = new Set(['B','STRONG','I','EM','U','S','STRIKE','DEL','UL','OL','LI','BR','P','DIV','A','CODE']);
const DROP = new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','TEMPLATE','NOSCRIPT','SVG','MATH','HEAD','TITLE','META','LINK','IMG','VIDEO','AUDIO','CANVAS','INPUT','BUTTON','SELECT','TEXTAREA','FORM']);
function cleanTree(parent){
  [...parent.childNodes].forEach(n=>{
    if(n.nodeType===3) return;
    if(n.nodeType!==1){ n.remove(); return; }
    const tag=n.tagName.toUpperCase();
    if(DROP.has(tag)){ n.remove(); return; }
    cleanTree(n);
    if(!ALLOWED.has(tag)){ n.replaceWith(...n.childNodes); return; }
    [...n.attributes].forEach(a=>{ if(!(tag==='A' && a.name==='href')) n.removeAttribute(a.name); });
    if(tag==='A'){ const h=(n.getAttribute('href')||'').trim(); if(!/^(https?:|mailto:)/i.test(h)) n.removeAttribute('href'); }
  });
}
function sanitize(html){
  if(!html) return '';
  const t=document.createElement('template'); t.innerHTML=html; cleanTree(t.content);
  let out=t.innerHTML.trim();
  if(/^(<br\s*\/?>|\s|&nbsp;)*$/i.test(out)) out='';
  return out;
}
function plainText(html){ const t=document.createElement('template'); t.innerHTML=html||''; return t.content.textContent||''; }
function isEmptyHtml(html){ return !plainText(html).trim() && !/<li/i.test(html||''); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function textToHtml(s){ return esc(s||'').replace(/\n/g,'<br>'); }

/* Converte qualquer versão (inclusive a antiga, só texto) para o formato atual */
function normalize(d){
  const v1 = !(d.version>=2);
  const files={};
  if(d.files && typeof d.files==='object'){
    Object.keys(d.files).forEach(k=>{ const f=d.files[k]; if(f && typeof f.dataUrl==='string' && /^data:/i.test(f.dataUrl)) files[k]={kind:f.kind==='image'?'image':'file',name:String(f.name||'arquivo'),size:+f.size||0,mime:String(f.mime||''),dataUrl:f.dataUrl}; });
  }
  const ids=new Set();
  function fix(n){
    if(typeof n.id!=='string' || !n.id || ids.has(n.id)) n.id=genId();
    ids.add(n.id);
    if(v1){ n.html=textToHtml(n.text||''); n.note=textToHtml(n.note||''); }
    delete n.text;
    n.html=sanitize(typeof n.html==='string'?n.html:'');
    n.note=sanitize(typeof n.note==='string'?n.note:'');
    n.color=COLORS[n.color]?n.color:'slate';
    n.collapsed=!!n.collapsed;
    n.attachments=(Array.isArray(n.attachments)?n.attachments:[]).map(a=>{
      if(typeof a==='string') return files[a]?a:null;
      if(a && typeof a==='object' && typeof a.dataUrl==='string' && /^data:/i.test(a.dataUrl)){
        const id=genId(); files[id]={kind:a.kind==='image'?'image':'file',name:String(a.name||'arquivo'),size:+a.size||0,mime:String(a.mime||''),dataUrl:a.dataUrl}; return id;
      }
      return null;
    }).filter(Boolean);
    n.children=(Array.isArray(n.children)?n.children:[]).filter(c=>c && typeof c==='object');
    n.children.forEach(fix);
  }
  fix(d.root);
  d.root.collapsed=false;
  d.root.children.forEach((c,i)=>{ if(c.side!=='L' && c.side!=='R') c.side = i%2 ? 'L' : 'R'; });
  return {version:2, root:d.root, files};
}

/* ================= Árvore ================= */
function findNode(id, node, parent, level){
  node=node||doc.root; parent=parent||null; level=level||0;
  if(node.id===id) return {node,parent,level};
  for(const c of node.children){ const r=findNode(id,c,node,level+1); if(r) return r; }
  return null;
}
function countAll(n){ let k=1; n.children.forEach(c=>k+=countAll(c)); return k; }
function subtreeIds(n,set){ set=set||new Set(); set.add(n.id); n.children.forEach(c=>subtreeIds(c,set)); return set; }
function colorize(n,color){ n.color=color; n.children.forEach(c=>colorize(c,color)); }

/* ================= Renderização ================= */
function render(){
  const seen=new Set();
  (function walk(n,level,dir){
    seen.add(n.id);
    let e=els.get(n.id);
    if(!e){
      e=document.createElement('div'); e.dataset.id=n.id;
      const c=document.createElement('div'); c.className='content'; e.appendChild(c);
      const b=document.createElement('span'); b.className='badges'; e.appendChild(b);
      world.appendChild(e); els.set(n.id,e);
      e._fresh=true;
    }
    updateEl(e,n,level,dir);
    if(!n.collapsed) n.children.forEach(c=>walk(c,level+1, level===0 ? (c.side==='L'?-1:1) : dir));
  })(doc.root,0,1);
  for(const [id,e] of els){ if(!seen.has(id)){ e.remove(); els.delete(id); } }
  layout();
  updatePanel();
  updateHistoryBtns();
}

function updateEl(e,n,level,dir){
  const cls=['node', level===0?'lv0':level===1?'lv1':'lvn', dir<0?'dirL':'dirR'];
  if(n.id===selectedId) cls.push('sel');
  if(n.id===editingId) cls.push('editing');
  if(matchSet.has(n.id)) cls.push('match');
  if(isEmptyHtml(n.html)) cls.push('empty');
  if(e._fresh){ cls.push('fresh'); e._fresh=false; setTimeout(()=>e.classList.remove('fresh'),220); }
  e.className=cls.join(' ');
  e._level=level; e._dir=dir;
  e.style.setProperty('--c', level===0 ? ROOT_INK : COLORS[n.color]);

  const content=e.firstChild;
  if(n.id!==editingId && content._h!==n.html){
    content.innerHTML=n.html; content._h=n.html;
    content.querySelectorAll('a[href]').forEach(a=>{ a.target='_blank'; a.rel='noopener noreferrer'; });
  }

  // selos: anotação / imagens / arquivos
  const imgs=n.attachments.filter(a=>doc.files[a] && doc.files[a].kind==='image').length;
  const fls=n.attachments.filter(a=>doc.files[a] && doc.files[a].kind!=='image').length;
  let bh='';
  if(!isEmptyHtml(n.note)) bh+='<span class="bd" title="Tem anotação">📝</span>';
  if(imgs) bh+='<span class="bd" title="Imagens">🖼'+(imgs>1?imgs:'')+'</span>';
  if(fls) bh+='<span class="bd" title="Arquivos">📎'+(fls>1?fls:'')+'</span>';
  const badges=e.children[1];
  if(badges._h!==bh){ badges.innerHTML=bh; badges._h=bh; badges.style.display=bh?'':'none'; }

  // botões laterais
  e.querySelectorAll('.h').forEach(h=>h.remove());
  const side=(btn,d,offset)=>{ if(d>0) btn.style.left='calc(100% + '+offset+'px)'; else btn.style.right='calc(100% + '+offset+'px)'; e.appendChild(btn); };
  if(level===0){
    const r=hBtn('add','+','Novo tópico à direita'); r.dataset.side='R'; side(r,1,7);
    const l=hBtn('add','+','Novo tópico à esquerda'); l.dataset.side='L'; side(l,-1,7);
  } else {
    let off=6;
    if(n.children.length){
      const f = n.collapsed ? hBtn('fold count', String(countAll(n)-1), 'Expandir') : hBtn('fold','−','Recolher');
      side(f,dir,off); off += n.collapsed ? 12+String(countAll(n)-1).length*6+6 : 24;
    }
    if(!n.collapsed) side(hBtn('add','+','Novo sub-tópico (Tab)'),dir,off);
  }
}
function hBtn(cls,txt,title){ const b=document.createElement('button'); b.className='h '+cls; b.textContent=txt; b.title=title; b.tabIndex=-1; return b; }

/* ================= Layout automático ================= */
const VGAP1=14, VGAPN=6;
function hgap(level){ return level===0?56:level===1?36:28; }
let layoutRAF=null;
function scheduleLayout(){ if(layoutRAF) return; layoutRAF=requestAnimationFrame(()=>{ layoutRAF=null; layout(); }); }

function layout(){
  const size=new Map();
  for(const [id,e] of els) size.set(id,{w:e.offsetWidth,h:e.offsetHeight});
  const subH=new Map();
  const blockH=(kids,level)=>{ if(!kids.length) return 0; let t=0; kids.forEach(c=>t+=sh(c,level)); return t+(level===1?VGAP1:VGAPN)*(kids.length-1); };
  function sh(n,level){
    if(subH.has(n.id)) return subH.get(n.id);
    let v=size.get(n.id).h;
    if(!n.collapsed && n.children.length) v=Math.max(v, blockH(n.children,level+1));
    subH.set(n.id,v); return v;
  }
  function place(n,level,x,cy,dir,parentId){
    const s=size.get(n.id);
    pos.set(n.id,{x:dir>0?x:x-s.w, y:cy-s.h/2, w:s.w, h:s.h, level, dir, parent:parentId});
    if(!n.collapsed && n.children.length) placeKids(n,n.children,level,dir);
  }
  function placeKids(n,kids,level,dir){
    if(!kids.length) return;
    const p=pos.get(n.id), gap=level+1===1?VGAP1:VGAPN;
    let y=p.y+p.h/2-blockH(kids,level+1)/2;
    const x=dir>0 ? p.x+p.w+hgap(level) : p.x-hgap(level);
    kids.forEach(c=>{ const hh=sh(c,level+1); place(c,level+1,x,y+hh/2,dir,n.id); y+=hh+gap; });
  }
  pos=new Map();
  const r=doc.root, rs=size.get(r.id);
  pos.set(r.id,{x:-rs.w/2,y:-rs.h/2,w:rs.w,h:rs.h,level:0,dir:1,parent:null});
  placeKids(r, r.children.filter(c=>c.side!=='L'), 0, 1);
  placeKids(r, r.children.filter(c=>c.side==='L'), 0, -1);

  for(const [id,p] of pos){ const e=els.get(id); if(e){ e.style.left=p.x+'px'; e.style.top=p.y+'px'; } }
  drawLinks();
}

function drawLinks(){
  let out='';
  for(const [id,p] of pos){
    if(!p.parent) continue;
    const pp=pos.get(p.parent); if(!pp) continue;
    const f=findNodeFast(id);
    const d=p.dir;
    const ax = d>0 ? pp.x+pp.w : pp.x;
    const ay = pp.level>=2 ? pp.y+pp.h-1 : pp.y+pp.h/2;
    const bx = d>0 ? p.x : p.x+p.w;
    const by = p.level>=2 ? p.y+p.h-1 : p.y+p.h/2;
    const mx=(ax+bx)/2;
    out+='<path d="M'+ax+','+ay+' C'+mx+','+ay+' '+mx+','+by+' '+bx+','+by+'" stroke="'+(f?COLORS[f.color]:'#94a3b8')+'" stroke-width="'+(p.level===1?2.5:2)+'" fill="none" stroke-linecap="round"/>';
  }
  svg.innerHTML=out;
}
let fastIndex=null;
function findNodeFast(id){
  if(!fastIndex || !fastIndex.has(id)){ fastIndex=new Map(); (function w(n){ fastIndex.set(n.id,n); n.children.forEach(w); })(doc.root); }
  return fastIndex.get(id);
}

/* ================= Câmera (mover / zoom) ================= */
function applyView(){
  world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.z+')';
  canvas.style.backgroundPosition=view.x+'px '+view.y+'px';
  canvas.style.backgroundSize=(20*view.z)+'px '+(20*view.z)+'px';
  $('#zoomPct').textContent=Math.round(view.z*100)+'%';
}
function toWorld(cx,cy){ const r=canvas.getBoundingClientRect(); return {x:(cx-r.left-view.x)/view.z, y:(cy-r.top-view.y)/view.z}; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function zoomAt(factor,cx,cy){
  const r=canvas.getBoundingClientRect();
  const px=(cx==null?r.width/2:cx-r.left), py=(cy==null?r.height/2:cy-r.top);
  const nz=clamp(view.z*factor,0.2,3);
  const wx=(px-view.x)/view.z, wy=(py-view.y)/view.z;
  view.z=nz; view.x=px-wx*nz; view.y=py-wy*nz; applyView();
}
let anim=null;
function animateView(tx,ty,tz){
  cancelAnimationFrame(anim);
  const sx=view.x, sy=view.y, sz=view.z, t0=performance.now(), dur=260;
  tz=tz==null?sz:tz;
  (function step(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    view.x=sx+(tx-sx)*e; view.y=sy+(ty-sy)*e; view.z=sz+(tz-sz)*e; applyView();
    if(k<1) anim=requestAnimationFrame(step);
  })(t0);
}
function bbox(){
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  for(const p of pos.values()){ x1=Math.min(x1,p.x); y1=Math.min(y1,p.y); x2=Math.max(x2,p.x+p.w); y2=Math.max(y2,p.y+p.h); }
  return {x1,y1,x2,y2};
}
function fit(animated){
  const b=bbox(), r=canvas.getBoundingClientRect();
  const z=clamp(Math.min((r.width-120)/(b.x2-b.x1),(r.height-120)/(b.y2-b.y1)),0.25,1);
  const tx=r.width/2-(b.x1+b.x2)/2*z, ty=r.height/2-(b.y1+b.y2)/2*z;
  if(animated) animateView(tx,ty,z); else { view.x=tx; view.y=ty; view.z=z; applyView(); }
}
function centerOn(id){
  const p=pos.get(id); if(!p) return; const r=canvas.getBoundingClientRect();
  animateView(r.width/2-(p.x+p.w/2)*view.z, r.height/2-(p.y+p.h/2)*view.z);
}
function ensureVisible(id){
  const p=pos.get(id); if(!p) return; const r=canvas.getBoundingClientRect(), m=50;
  const sx1=p.x*view.z+view.x, sy1=p.y*view.z+view.y, sx2=sx1+p.w*view.z, sy2=sy1+p.h*view.z;
  let dx=0, dy=0;
  if(sx1<m) dx=m-sx1; else if(sx2>r.width-m) dx=(r.width-m)-sx2;
  if(sy1<m) dy=m-sy1; else if(sy2>r.height-m) dy=(r.height-m)-sy2;
  if(dx||dy) animateView(view.x+dx, view.y+dy);
}

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const k=e.deltaMode===1?16:1;
  if(e.ctrlKey||e.metaKey){ zoomAt(Math.exp(-e.deltaY*k*0.0022), e.clientX, e.clientY); }
  else {
    let dx=e.deltaX*k, dy=e.deltaY*k;
    if(e.shiftKey && !dx){ dx=dy; dy=0; }
    view.x-=dx; view.y-=dy; applyView();
  }
},{passive:false});
$('#zoomIn').addEventListener('click',()=>zoomAt(1.2));
$('#zoomOut').addEventListener('click',()=>zoomAt(1/1.2));
$('#zoomPct').addEventListener('click',()=>zoomAt(1/view.z));
$('#fitBtn').addEventListener('click',()=>fit(true));
$('#keysBtn').addEventListener('click',()=>$('#keysPop').classList.toggle('hidden'));

/* ================= Ponteiro: selecionar, arrastar tópico, mover mapa ================= */
let ptr=null, drag=null, lastClick={id:null,t:0};

canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0 && e.button!==1) return;
  if(e.target.closest('.h,.zoombar,.keys-pop')) return;
  const nEl=e.target.closest('.node');
  if(nEl && nEl.classList.contains('editing')) return;
  $('#keysPop').classList.add('hidden');
  cancelAnimationFrame(anim);
  ptr={mode:'pending', id:nEl?nEl.dataset.id:null, target:e.target, sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y, middle:e.button===1};
  if(document.activeElement && document.activeElement!==document.body) document.activeElement.blur();
  canvas.setPointerCapture(e.pointerId);
  e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
  if(!ptr) return;
  const dx=e.clientX-ptr.sx, dy=e.clientY-ptr.sy;
  if(ptr.mode==='pending'){
    if(Math.hypot(dx,dy)<4) return;
    if(ptr.id && ptr.id!==doc.root.id && !ptr.middle) startDrag(e); else { ptr.mode='pan'; canvas.classList.add('panning'); }
  }
  if(ptr.mode==='pan'){ view.x=ptr.vx+dx; view.y=ptr.vy+dy; applyView(); }
  else if(ptr.mode==='drag') moveDrag(e);
});
canvas.addEventListener('pointerup',e=>{
  if(!ptr) return;
  const p=ptr; ptr=null; canvas.classList.remove('panning');
  if(p.mode==='drag'){ endDrag(true); return; }
  if(p.mode!=='pending') return;
  if(!p.id){ selectNode(null); return; }
  const a=p.target.closest && p.target.closest('a[href]');
  if(a){ window.open(a.href,'_blank','noopener'); }
  const now=Date.now();
  if(lastClick.id===p.id && now-lastClick.t<400){ lastClick={id:null,t:0}; selectNode(p.id); startInlineEdit(p.id); }
  else { lastClick={id:p.id,t:now}; selectNode(p.id); }
});
canvas.addEventListener('pointercancel',()=>{ if(ptr && ptr.mode==='drag') endDrag(false); ptr=null; canvas.classList.remove('panning'); });

/* botões + e recolher */
world.addEventListener('click',e=>{
  const h=e.target.closest('.h'); if(!h) return;
  const id=h.closest('.node').dataset.id;
  if(h.classList.contains('add')) addChild(id, h.dataset.side);
  else if(h.classList.contains('fold')) toggleCollapse(id);
});

function startDrag(e){
  ptr.mode='drag';
  const id=ptr.id, f=findNode(id);
  selectNode(id);
  const sub=subtreeIds(f.node);
  sub.forEach(i=>{ const el=els.get(i); if(el) el.classList.add('drag-src'); });
  const src=els.get(id);
  const ghost=src.cloneNode(true);
  ghost.classList.remove('drag-src','sel','match','fresh'); ghost.classList.add('ghost');
  ghost.querySelectorAll('.h').forEach(h=>h.remove());
  world.appendChild(ghost);
  const line=document.createElement('div'); line.className='drop-line hidden'; world.appendChild(line);
  const wp=toWorld(e.clientX,e.clientY), pp=pos.get(id);
  drag={id, sub, ghost, line, offX:wp.x-pp.x, offY:wp.y-pp.y, target:null};
}
function moveDrag(e){
  const wp=toWorld(e.clientX,e.clientY);
  drag.ghost.style.left=(wp.x-drag.offX)+'px'; drag.ghost.style.top=(wp.y-drag.offY)+'px';
  // procura o tópico mais próximo do ponteiro
  let best=null, bd=70;
  for(const [id,p] of pos){
    if(drag.sub.has(id)) continue;
    const ddx=Math.max(p.x-wp.x,0,wp.x-(p.x+p.w)), ddy=Math.max(p.y-wp.y,0,wp.y-(p.y+p.h));
    const d=Math.hypot(ddx,ddy);
    if(d<bd){ bd=d; best={id,p,inside:d===0}; }
  }
  let t=null;
  if(best){
    const {id,p}=best;
    if(id===doc.root.id) t={mode:'child', id, side: wp.x<p.x+p.w/2 ? 'L' : 'R'};
    else {
      const outer = p.dir>0 ? wp.x>p.x+p.w*0.6 : wp.x<p.x+p.w*0.4;
      const ry=(wp.y-p.y)/p.h;
      if(best.inside){ t = ry<0.3 ? {mode:'before',id} : ry>0.7 ? {mode:'after',id} : {mode:'child',id}; }
      else if(outer && ry>=-0.2 && ry<=1.2) t={mode:'child',id};
      else t={mode: wp.y<p.y+p.h/2 ? 'before':'after', id};
    }
  }
  setDropIndicator(t);
}
function setDropIndicator(t){
  if(drag.target && drag.target.mode==='child'){ const el=els.get(drag.target.id); if(el) el.classList.remove('drop-child'); }
  drag.target=t;
  drag.line.classList.add('hidden');
  if(!t) return;
  if(t.mode==='child'){ const el=els.get(t.id); if(el) el.classList.add('drop-child'); }
  else {
    const p=pos.get(t.id), g=(p.level===1?VGAP1:VGAPN)/2+1;
    drag.line.style.left=p.x+'px'; drag.line.style.width=p.w+'px';
    drag.line.style.top=(t.mode==='before' ? p.y-g : p.y+p.h+g)+'px';
    drag.line.classList.remove('hidden');
  }
}
function endDrag(commit){
  const d=drag; drag=null;
  d.ghost.remove(); d.line.remove();
  for(const el of els.values()) el.classList.remove('drag-src','drop-child');
  if(commit && d.target) moveNode(d.id, d.target, d.sub);
}
function moveNode(id,t,sub){
  const src=findNode(id); if(!src || !src.parent) return;
  if(sub.has(t.id)) return;
  pushHistory();
  const oldParent=src.parent;
  oldParent.children.splice(oldParent.children.indexOf(src.node),1);
  let newParent;
  if(t.mode==='child'){
    newParent=findNode(t.id).node;
    newParent.children.push(src.node); newParent.collapsed=false;
    if(newParent===doc.root) src.node.side=t.side;
  } else {
    const tf=findNode(t.id); newParent=tf.parent;
    const i=newParent.children.indexOf(tf.node);
    newParent.children.splice(t.mode==='before'?i:i+1, 0, src.node);
    if(newParent===doc.root) src.node.side=tf.node.side;
  }
  if(newParent!==doc.root){ delete src.node.side; if(newParent!==oldParent) colorize(src.node,newParent.color); }
  else if(oldParent!==doc.root && src.node.color==='slate') colorize(src.node,nextBranchColor());
  fastIndex=null;
  render(); saveSoon();
}

function selectNode(id){

/* ================= Edição direto no mapa ================= */
function placeCaretEnd(elm){

}
function startInlineEdit(id){

function endInlineEdit(){

world.addEventListener('input',e=>{

world.addEventListener('keydown',e=>{

});

/* ================= Operações ================= */
function nextBranchColor(){
  const used={}; doc.root.children.forEach(c=>used[c.color]=(used[c.color]||0)+1);
  let best=BRANCH_ORDER[0], bc=Infinity;
  BRANCH_ORDER.forEach(k=>{ const u=used[k]||0; if(u<bc){ bc=u; best=k; } });
  return best;
}
function balancedSide(){ let l=0,r=0; doc.root.children.forEach(c=>c.side==='L'?l++:r++); return l<r?'L':'R'; }

function addChild(id, side){
  const f=findNode(id); if(!f) return;
  pushHistory();
  const isRoot=f.node===doc.root;
  const c=mk('', isRoot ? nextBranchColor() : f.node.color);
  if(isRoot) c.side = side || balancedSide();
  f.node.collapsed=false;
  f.node.children.push(c);
  selectedId=c.id; fastIndex=null;
  render(); ensureVisible(c.id); startInlineEdit(c.id); saveSoon();
}
function addSibling(id){
  const f=findNode(id); if(!f) return;
  if(!f.parent){ addChild(id); return; }
  pushHistory();
  const c=mk('', f.node.color);
  if(f.parent===doc.root){ c.side=f.node.side; c.color=nextBranchColor(); }
  f.parent.children.splice(f.parent.children.indexOf(f.node)+1,0,c);
  selectedId=c.id; fastIndex=null;
  render(); ensureVisible(c.id); startInlineEdit(c.id); saveSoon();
}
function deleteNode(id){
  const f=findNode(id); if(!f) return;
  if(!f.parent){ toast('O tópico central não pode ser excluído.'); return; }
  pushHistory();
  const sibs=f.parent.children, i=sibs.indexOf(f.node);
  sibs.splice(i,1);
  const next = sibs[i] || sibs[i-1] || f.parent;
  selectedId=next.id; fastIndex=null;
  render(); saveSoon();
  toast('Tópico excluído · Ctrl+Z desfaz');
}
function toggleCollapse(id){
  const f=findNode(id); if(!f || !f.node.children.length || !f.parent) return;
  pushHistory();
  f.node.collapsed=!f.node.collapsed;
  render(); saveSoon();
}

/* ================= Navegação pelo teclado ================= */
function navigate(key){
  const f=findNode(selectedId); if(!f) return;
  const n=f.node, p=pos.get(n.id); if(!p) return;
  const cy=p.y+p.h/2;
  const pickNearest=list=>{ let b=null,bd=Infinity; list.forEach(c=>{ const q=pos.get(c.id); if(!q) return; const d=Math.abs(q.y+q.h/2-cy); if(d<bd){bd=d;b=c;} }); return b; };
  const toChild=wantLeft=>{
    let kids=n.children;
    if(n===doc.root) kids=kids.filter(c=>(c.side==='L')===wantLeft);
    if(!kids.length) return;
    if(n.collapsed){ n.collapsed=false; render(); saveSoon(); }
    const c=pickNearest(kids); if(c) go(c.id);
  };
  const go=id=>{ selectNode(id); ensureVisible(id); };
  if(key==='ArrowLeft' || key==='ArrowRight'){
    const left=key==='ArrowLeft';
    if(n===doc.root) toChild(left);
    else if((p.dir<0)===left) toChild(left);
    else go(f.parent.id);
    return;
  }
  // cima / baixo: irmãos primeiro, depois o vizinho visual mais próximo
  const up=key==='ArrowUp';
  if(f.parent){
    const sibs = f.parent===doc.root ? f.parent.children.filter(c=>c.side===n.side) : f.parent.children;
    const i=sibs.indexOf(n), j=up?i-1:i+1;
    if(sibs[j]){ go(sibs[j].id); return; }
  }
  let best=null, bd=Infinity;
  for(const [id,q] of pos){
    if(id===n.id) continue;
    const qy=q.y+q.h/2, dy=up?cy-qy:qy-cy;
    if(dy<=2) continue;
    const dx=Math.abs((q.x+q.w/2)-(p.x+p.w/2));
    const score=dy+dx*0.6;
    if(score<bd){ bd=score; best=id; }
  }
  if(best) go(best);
}

/* ================= Teclado global ================= */
document.addEventListener('keydown',e=>{
  const t=e.target;
  const inEditable = t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod && k==='f'){ e.preventDefault(); $('#search').focus(); $('#search').select(); return; }
  if(inEditable) return;
  if(mod){
    if(k==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if((k==='z' && e.shiftKey) || k==='y'){ e.preventDefault(); redo(); }
    else if(k==='=' || k==='+'){ e.preventDefault(); zoomAt(1.2); }
    else if(k==='-'){ e.preventDefault(); zoomAt(1/1.2); }
    else if(k==='0'){ e.preventDefault(); fit(true); }
    return;
  }
  if(e.altKey) return;
  if(!selectedId){
    if(['Enter','Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){ e.preventDefault(); selectNode(doc.root.id); }
    return;
  }
  switch(e.key){
    case 'Tab': e.preventDefault(); addChild(selectedId); break;
    case 'Enter': e.preventDefault(); addSibling(selectedId); break;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteNode(selectedId); break;
    case 'F2': e.preventDefault(); startInlineEdit(selectedId); break;
    case ' ': e.preventDefault(); toggleCollapse(selectedId); break;
    case 'Escape': selectNode(null); break;
    case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': e.preventDefault(); navigate(e.key); break;
    default:
      // começou a digitar: o texto vai direto para o painel de edição
      if(e.key.length===1){ showPanel(true); rteText.focus({preventScroll:true}); placeCaretEnd(rteText); }
  }
});

function insertLink(){
  const sel=getSelection(); const range=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
  let url=prompt('Endereço do link:','https://');
  if(!url) return;
  url=url.trim(); if(!/^[a-z]+:/i.test(url)) url=(url.includes('@')&&!url.includes('/')?'mailto:':'https://')+url;
  if(!/^(https?:|mailto:)/i.test(url)){ toast('Link inválido.'); return; }
  if(range){ sel.removeAllRanges(); sel.addRange(range); }
  if(!range || range.collapsed) document.execCommand('insertHTML',false,'<a href="'+esc(url)+'">'+esc(url.replace(/^mailto:/,''))+'</a>&nbsp;');
  else document.execCommand('createLink',false,url);
}

function renderAttList(n){
  const key=n.id+'|'+n.attachments.join(',');
  if(attList._k===key) return; attList._k=key;
  attList.innerHTML='';
  if(!n.attachments.length){ attList.innerHTML='<div class="hint">Nenhum anexo.</div>'; return; }
  n.attachments.forEach(fid=>{
    const a=doc.files[fid]; if(!a) return;
    const row=document.createElement('div'); row.className='att';
    if(a.kind==='image'){ const im=document.createElement('img'); im.src=a.dataUrl; im.alt=a.name; im.addEventListener('click',()=>showLightbox(a.dataUrl)); row.appendChild(im); }
    else { const ic=document.createElement('div'); ic.className='ic'; ic.textContent='📄'; row.appendChild(ic); }
    const meta=document.createElement('div'); meta.className='meta';
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=a.name; nm.title=a.name;
    const sz=document.createElement('div'); sz.className='sz'; sz.textContent=(a.kind==='image'?'Imagem · ':'Arquivo · ')+fmtSize(a.size);
    meta.appendChild(nm); meta.appendChild(sz); row.appendChild(meta);
    const dl=document.createElement('button'); dl.className='x'; dl.textContent='⬇'; dl.title='Baixar'; dl.addEventListener('click',()=>download(a)); row.appendChild(dl);
    const x=document.createElement('button'); x.className='x del'; x.textContent='✕'; x.title='Remover';
    x.addEventListener('click',()=>{ pushHistory(); n.attachments=n.attachments.filter(z=>z!==fid); render(); saveSoon(); });
    row.appendChild(x);
    attList.appendChild(row);
  });
}
function fmtSize(b){ if(!b) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

/* ================= Desfazer / refazer ================= */
const past=[], future=[];
function snap(){ return {root:JSON.stringify(doc.root), sel:selectedId}; }
function pushHistory(){ past.push(snap()); if(past.length>200) past.shift(); future.length=0; updateHistoryBtns(); }
function beginEditSession(key){ if(editSession!==key){ pushHistory(); editSession=key; } }
function restore(s){
  doc.root=JSON.parse(s.root); fastIndex=null;
  selectedId = s.sel && findNode(s.sel) ? s.sel : (selectedId && findNode(selectedId) ? selectedId : null);
  render(); saveSoon();
}
function undo(){ if(editingId) endInlineEdit(); if(!past.length) return; future.push(snap()); restore(past.pop()); }
function redo(){ if(editingId) endInlineEdit(); if(!future.length) return; past.push(snap()); restore(future.pop()); }
function updateHistoryBtns(){ $('#undoBtn').disabled=!past.length; $('#redoBtn').disabled=!future.length; }
$('#undoBtn').addEventListener('click',undo);
$('#redoBtn').addEventListener('click',redo);

/* ================= Salvamento ================= */
const statusEl=$('#status'); let saveTimer=null;
function persistable(){
  const used=new Set(); (function w(n){ n.attachments.forEach(a=>used.add(a)); n.children.forEach(w); })(doc.root);
  const files={}; used.forEach(k=>{ if(doc.files[k]) files[k]=doc.files[k]; });
  return {version:2, root:doc.root, files};
}
function saveSoon(){ fastIndex=null; statusEl.textContent='Salvando…'; clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); }
async function saveNow(){
  const ok=await Store.save(persistable());
  const t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  statusEl.textContent = ok ? ('Salvo ✓ '+t) : '⚠ Falha ao salvar';
}
window.addEventListener('pagehide',()=>{ if(doc) Store.save(persistable()); });

$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      if(!parsed || !parsed.root || typeof parsed.root!=='object') throw new Error('formato');
      if(!confirm('Importar este arquivo? Ele substituirá o mapa atual (dá para desfazer com Ctrl+Z).')) return;
      pushHistory();
      const nd=normalize(parsed);
      Object.assign(doc.files, nd.files); doc.root=nd.root;
      selectedId=doc.root.id; fastIndex=null;
      for(const el of els.values()) el.remove(); els.clear();
      render(); fit(true); saveNow(); toast('Mapa importado!');
    }catch(err){ toast('Arquivo inválido.'); }
  };
  r.readAsText(file); e.target.value='';
});

/* ================= Busca ================= */
let matches=[], mIdx=0;
const searchEl=$('#search'), cntEl=$('#searchCnt');
function runSearch(){
  const q=searchEl.value.trim().toLowerCase();
  matches=[]; matchSet=new Set(); mIdx=0;
  if(q){
    (function walk(n,anc){
      if((plainText(n.html)+' '+plainText(n.note)).toLowerCase().includes(q)){ matches.push(n.id); anc.forEach(a=>{ a.collapsed=false; }); }
      n.children.forEach(c=>walk(c,anc.concat(n)));
    })(doc.root,[]);
    matchSet=new Set(matches);
  }
  cntEl.textContent = q ? (matches.length ? '1/'+matches.length : '0') : '';
  render();
  if(matches.length){ selectNode(matches[0]); centerOn(matches[0]); }
}
searchEl.addEventListener('input',runSearch);
searchEl.addEventListener('keydown',e=>{
  if(e.key==='Enter' && matches.length){
    e.preventDefault();
    mIdx=(mIdx+(e.shiftKey?-1:1)+matches.length)%matches.length;
    cntEl.textContent=(mIdx+1)+'/'+matches.length;
    selectNode(matches[mIdx]); centerOn(matches[mIdx]);
  } else if(e.key==='Escape'){ searchEl.value=''; runSearch(); searchEl.blur(); }
});

/* ================= Toast ================= */
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }

/* ================= Início ================= */
(async function init(){
  const loaded=await Store.load();
  doc = loaded && loaded.root ? normalize(loaded) : defaultDoc();
  selectedId=doc.root.id;
  render();
  fit(false);
  statusEl.textContent='Pronto ✓';
  window.addEventListener('resize',()=>scheduleLayout());
})();

})();
</script>
